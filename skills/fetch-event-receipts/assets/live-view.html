<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Browserbase receipt agent</title>
    <style>
      :root {
        color-scheme: light;
        --red: #ff4500;
        --black: #000000;
        --white: #ffffff;
        --grey-100: #f8fafc;
        --grey-200: #f0f4f8;
        --grey-300: #e1e9f2;
        --grey-500: #c5d3e8;
        --grey-800: #5a78af;
        --grey-900: #46639f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--grey-100);
        color: var(--black);
        font-family: "Plain", "IBM Plex Sans", sans-serif;
      }

      .topbar {
        min-height: 92px;
        padding: 20px clamp(24px, 4vw, 64px);
        border-bottom: 1px solid var(--grey-500);
        background: var(--white);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
      }

      .eyebrow,
      .status,
      .footer-label {
        font-family: "GT Standard Mono", "IBM Plex Mono", monospace;
        letter-spacing: -0.01em;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--grey-800);
        font-size: 11px;
        line-height: 15px;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "GT Planar Medium", "Work Sans", sans-serif;
        font-size: clamp(28px, 3.2vw, 46px);
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1;
      }

      .status {
        max-width: 520px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--grey-800);
        font-size: 11px;
        line-height: 16px;
        text-align: right;
      }

      .status::before {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        background: var(--red);
        content: "";
      }

      .status.stopped {
        color: var(--grey-900);
      }

      .status.stopped::before {
        background: var(--grey-900);
      }

      .page {
        width: min(1540px, 100%);
        margin: 0 auto;
        padding: clamp(20px, 3vw, 48px);
      }

      .viewer-card {
        overflow: hidden;
        border: 1px solid var(--grey-500);
        background: var(--white);
      }

      .viewer-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        height: 36px;
        padding: 0 12px;
        border-bottom: 1px solid var(--grey-500);
        background: var(--white);
        color: var(--grey-800);
        font-family: "GT Standard Mono", "IBM Plex Mono", monospace;
        font-size: 10px;
        letter-spacing: -0.01em;
        line-height: 14px;
        text-transform: uppercase;
      }

      .browser-shell {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: var(--grey-200);
      }

      .live-viewport {
        position: absolute;
        z-index: 1;
        inset: 0;
        overflow: hidden;
        background: var(--grey-200);
      }

      .live-browser {
        position: absolute;
        top: -32px;
        left: 0;
        display: block;
        width: 100%;
        height: calc(100% + 32px);
        border: 0;
        background: var(--grey-200);
        pointer-events: none;
      }

      .browser-placeholder {
        position: absolute;
        z-index: 2;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--grey-200);
        color: var(--grey-800);
        font-family: "GT Standard Mono", "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: -0.01em;
        text-align: center;
      }

      .browser-placeholder[hidden] {
        display: none;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        margin-top: clamp(28px, 4vw, 52px);
        padding-top: 14px;
        border-top: 1px solid var(--grey-500);
      }

      .footer-label {
        color: var(--grey-800);
        font-size: 9px;
        line-height: 14px;
        text-transform: uppercase;
      }

      @media (max-width: 820px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
          gap: 16px;
        }

        .status {
          text-align: left;
        }

      }
    </style>
    <script src="/live-view.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Ramp agent identity · Browserbase</p>
        <h1>Receipt fetching agent</h1>
      </div>
      <div class="status" id="overallStatus" role="status" aria-live="polite">
        Waiting for the Browserbase session.
      </div>
    </header>

    <main class="page">
      <section aria-label="Live receipt workflow">
        <div class="viewer-card">
          <div class="viewer-label">
            <span>Live browser</span>
            <span>DoorDash → Ramp</span>
          </div>
          <div class="browser-shell">
            <div class="browser-placeholder" id="browserPlaceholder">Starting live browser.</div>
            <div class="live-viewport">
              <iframe
                class="live-browser"
                id="liveBrowser"
                title="Live Browserbase receipt session"
                sandbox="allow-same-origin allow-scripts allow-forms"
                referrerpolicy="no-referrer"
                tabindex="-1"
              ></iframe>
            </div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <span class="footer-label">Browserbase</span>
        <span class="footer-label">Recorded demo view</span>
      </footer>
    </main>
  </body>
</html>
